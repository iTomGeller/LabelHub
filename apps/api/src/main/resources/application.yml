server:
  port: ${LABELHUB_API_PORT:8080}

spring:
  application:
    name: labelhub-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/labelhub?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:labelhub}
    password: ${SPRING_DATASOURCE_PASSWORD:labelhub}
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: ${JPA_SHOW_SQL:true}
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6380}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

deepseek:
  api-key: ${DEEPSEEK_API_KEY:}
  base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
  model: deepseek-chat

labelhub:
  knowledge:
    seed-enabled: ${LABELHUB_KNOWLEDGE_SEED_ENABLED:true}
